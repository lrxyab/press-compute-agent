# Managed by pyinfra — forwarding for routed/bridged VM traffic on the hypervisor.
# IP forwarding (route packets between the host, OVN overlay and VM bridges).
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Proxy ARP / "ARP forwarding" — answer ARP on behalf of VMs where needed.
net.ipv4.conf.all.proxy_arp = 1
net.ipv4.conf.default.proxy_arp = 1

# Loose reverse-path filtering so OVN's encapsulated / asymmetric paths are not
# dropped (strict rp_filter breaks geneve / multi-NIC routing).
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Do not run bridged traffic through iptables (OVS/OVN handle their own filtering).
net.bridge.bridge-nf-call-iptables = 0
net.bridge.bridge-nf-call-ip6tables = 0
net.bridge.bridge-nf-call-arptables = 0
