# Managed by pyinfra — expose the OVS management socket to the `openvswitch`
# group so the frappe user can run `ovs-vsctl` directly (the app calls it without
# sudo, e.g. Network Bridge.on_submit -> `ovs-vsctl add-br`).
[Service]
ExecStartPost=/bin/sh -c 'chgrp openvswitch /run/openvswitch/db.sock && chmod 0660 /run/openvswitch/db.sock'
